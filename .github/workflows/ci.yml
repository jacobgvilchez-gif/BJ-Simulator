name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

# Least privilege: these jobs only need to read the repo.
permissions:
  contents: read

# Cancel superseded runs on a PR, but never cancel a run on main.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  hygiene:
    name: Repo hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check for merge conflict markers
        shell: bash
        run: |
          if git grep -nIE '^(<{7}|={7}|>{7})( |$)' -- .; then
            echo "::error::Merge conflict markers found in the files listed above."
            exit 1
          fi

      - name: Check for oversized files
        shell: bash
        run: |
          limit=$((5 * 1024 * 1024))
          fail=0
          while IFS= read -r f; do
            size=$(git cat-file -s "$(git rev-parse ":$f")")
            if [ "$size" -gt "$limit" ]; then
              echo "::error file=$f::$f is $((size / 1024 / 1024))MB, over the 5MB limit."
              fail=1
            fi
          done < <(git ls-files)
          exit "$fail"

      - name: Check for case-insensitive filename collisions
        shell: bash
        run: |
          dupes=$(git ls-files | tr '[:upper:]' '[:lower:]' | sort | uniq -d)
          if [ -n "$dupes" ]; then
            echo "::error::These paths collide on Windows/macOS filesystems:"
            echo "$dupes"
            exit 1
          fi

  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Also runs shellcheck over every `run:` block in these workflows.
      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  # Resolves the Node matrix at run time rather than hard-coding it, so PRs get
  # fast feedback on the versions that matter and main gets the full sweep.
  matrix:
    name: Resolve build matrix
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.resolve.outputs.versions }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve Node versions
        id: resolve
        shell: bash
        # github.event_name is a fixed enum, but pass it through env rather than
        # interpolating into the script body — that habit is what keeps a future
        # edit from turning into a script-injection bug.
        env:
          EVENT: ${{ github.event_name }}
        run: |
          dev="$(tr -d '[:space:]' < .nvmrc)"
          if [ "$EVENT" = "pull_request" ]; then
            # Just the version developers actually run, for a fast signal.
            versions="[\"$dev\"]"
          else
            # Everything supported, so a regression on another line cannot reach main.
            versions='["20", "22", "24"]'
          fi
          echo "versions=$versions" >> "$GITHUB_OUTPUT"
          echo "Resolved Node matrix: $versions"

  verify:
    name: Verify (Node ${{ matrix.node }})
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(needs.matrix.outputs.versions) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Stable single status for branch protection. A matrix job reports one check
  # per leg ("Verify (Node 20)", ...), and those names change whenever the matrix
  # changes — so a required check pointed at them would break. This gate keeps
  # one unchanging name, "Build and test", regardless of how the matrix evolves.
  build:
    name: Build and test
    needs: verify
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check matrix result
        shell: bash
        env:
          RESULT: ${{ needs.verify.result }}
        run: |
          echo "Matrix result: $RESULT"
          if [ "$RESULT" != "success" ]; then
            echo "::error::One or more Verify legs did not succeed."
            exit 1
          fi
